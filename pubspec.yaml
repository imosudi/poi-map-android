name: poi_map_android
description: "Vienna POI Explorer Android application powered by Vienna Open Government Data."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Private application package; not published to pub.dev.

# Application versionName+versionCode.
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  dio: ^5.11.1
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  flutter_blue_plus: ^2.3.15

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Lint rules are configured in `analysis_options.yaml`.
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:

  uses-material-design: true

  assets:
    - assets/branding/
    - assets/config/
    - assets/icons/
    - assets/markers/
    - assets/ui/
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
