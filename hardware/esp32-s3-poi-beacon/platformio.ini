[platformio]
src_dir = firmware
include_dir = include

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
; Auto-detect serial port (currently enumerated as /dev/ttyUSB1)
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0

; Verified on physical unit (MAC 94:a9:90:1c:78:14): 8MB Quad Flash, 3.3V.
board_build.flash_size = 8MB
board_build.flash_mode = qio
build_flags =
    -Iinclude

